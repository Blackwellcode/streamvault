server {
    listen 80;
    server_name localhost;

    # --- Performance Tuning für Video-Streaming ---
    sendfile on;              # Kopiert Daten direkt im Kernel (null CPU Last)
    tcp_nopush on;            # Sendet Datei-Header und Daten zusammen (schnellerer Start)
    tcp_nodelay on;           # Verhindert Verzögerungen bei kleinen Paketen
    keepalive_timeout 65;     # Hält Verbindungen länger offen (gut fürs Spulen)
    types_hash_max_size 2048;
    
    # Cache fuer Datei-Informationen (beschleunigt Zugriff auf viele kleine Dateien wie HLS/Thumbs)
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Gzip Komprimierung für Text-Inhalte (schnelleres Laden)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    
    # Upload-Limit begrenzen; bei Bedarf bewusst per Config erhoehen.
    client_max_body_size 2g;
    
    # Puffer für Uploads optimieren
    client_body_buffer_size 128k;

    # Proxy für die Web-Oberfläche (Python)
    location / {
        proxy_pass http://127.0.0.1:8081;  # gunicorn bound to 127.0.0.1:8081
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        
        # Timeouts erhöhen (wichtig für langsame Verbindungen)
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # X-Accel-Redirect für VODs (Hier passiert das Streaming)
    location /_protected/ {
        internal;
        alias /app/data/;
        
        # Optimierungen für große Dateien
        sendfile on;
        sendfile_max_chunk 1m; # Verhindert, dass ein Download den Server blockiert
        output_buffers 2 1m;   # Größerer Puffer (2MB) für flüssiges Playback
        gzip off;              # Videos nicht komprimieren (spart CPU)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type" always;
        add_header Accept-Ranges bytes always;
        
        # Optional: Bandbreite begrenzen, falls das Netzwerk der Flaschenhals ist
        # limit_rate_after 50m; # Volle Geschwindigkeit für die ersten 50MB
        # limit_rate 10m;       # Danach auf 10MB/s begrenzen
    }

    location /_protected_vodcache/ {
        internal;
        alias /app/data/.vodcache/;
        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        gzip off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type" always;
        add_header Accept-Ranges bytes always;
    }

    # X-Accel-Redirect für Thumbnails
    location /_protected_thumbs/ {
        internal;
        alias /app/data/.thumbs/;
        expires 1d;            # Browser-Caching aktivieren
        add_header Cache-Control "public";
    }
    
    # X-Accel-Redirect für HLS
    location /_protected_hls/ {
        internal;
        alias /app/data/.hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s mp4;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type" always;
        add_header Accept-Ranges bytes always;
    }
    
    # X-Accel-Redirect für Live HLS
    location /_protected_hls_live/ {
        internal;
        alias /dev/shm/streamrecorder_hls/;
        open_file_cache off;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s mp4;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type" always;
        add_header Accept-Ranges bytes always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
