# WebSocket upgrades only when the client asks for one; plain requests keep
# "Connection: close" semantics towards gunicorn.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without cookies and without query strings ($request would log
# ?token= and other secrets; $uri is the path only); rt/urt show slow
# requests and slow upstreams.
map $http_referer $referer_path {
    default "-";
    "~^(?<referer_base>[^?#]+)" $referer_base;
}
log_format timed '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$referer_path" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log timed;

    # --- Performance tuning for video streaming ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Cache file metadata (speeds up HLS/thumbnail access).
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    # Every response is proxied; without gzip_proxied nginx compresses none of them.
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Upload limit for the WebUI (resource uploads, banners, avatars).
    client_max_body_size 2g;
    client_body_buffer_size 128k;

    # --- Web UI / API ---
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only the /_live_auth subrequest may carry this marker; clients cannot inject it.
        proxy_set_header X-StreamVault-Live-Auth "";
        proxy_hide_header Server;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # --- X-Accel-Redirect media offload ---
    # A location with its own add_header does not inherit the server-level
    # ones, so every such location repeats the security headers.
    # WebUI paths are /_protected/<archive>/<filename>; archives live directly
    # below VOD_BASE_DIR (/app/data in the container).
    location /_protected/ {
        internal;
        alias /app/data/;

        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Legacy archives stored below VOD_FILES_DIR (default /app/data/files).
    location /_protected_files/ {
        internal;
        alias /app/data/files/;

        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /_protected_vodcache/ {
        internal;
        alias /app/data/.vodcache/;
        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /_protected_thumbs/ {
        internal;
        alias /app/data/.thumbs/;
        # Thumbnails sit behind login: browser cache only, never shared caches.
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /_protected_hls/ {
        internal;
        alias /app/data/.hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s mp4;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /_protected_hls_live/ {
        internal;
        alias /app/.hls_live/;
        open_file_cache off;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s mp4;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Direct live routes (login required) ---
    # The live player fetches /live/<channel>.ts (MPEG-TS) and
    # /live/<channel>/stream.m3u8 + seg_N.ts (LL-HLS) directly from nginx.
    # Every request is checked by the WebUI first: session plus channel
    # visibility, otherwise 401/403. Requires ngx_http_auth_request_module
    # (part of the nginx:alpine image and the Debian/Ubuntu nginx packages).
    location = /_live_auth {
        internal;
        proxy_pass http://app:8080/api/live/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # Marks the request as nginx's auth subrequest; /api/live/auth answers 404 without it.
        proxy_set_header X-StreamVault-Live-Auth 1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time MPEG-TS from the livebot program in the app container. If it is
    # not running nginx answers 502 and the player switches to HLS.
    location ~ ^/live/[A-Za-z0-9_-]+\.ts$ {
        auth_request /_live_auth;
        proxy_pass http://app:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The session was checked above; the livebot never needs the cookie.
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        tcp_nodelay on;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Accel-Buffering "no" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # LL-HLS playlist and segments straight from the live HLS directory
    # (LIVE_HLS_DIR, shared with the app container through the hls_live volume).
    location ~ ^/live/(?<hls_chan>[A-Za-z0-9_-]+)/(?<hls_file>(stream|index)\.m3u8|seg_[0-9]+\.ts)$ {
        auth_request /_live_auth;
        alias /app/.hls_live/$hls_chan/$hls_file;
        open_file_cache off;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
