name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: please do **not** file them here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - install.sh (systemd)
        - Docker Compose
        - Manual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.0.0 or 1a2b3c4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: e.g. Ubuntu 22.04, Python 3.10.12
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: "`streamvault logs <service>` or `docker compose logs`. Remove tokens and passwords."
      render: text
