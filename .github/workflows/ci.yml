name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = Ubuntu 22.04, 3.11 = Debian 12 (production targets); 3.12 = current.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.3

      - name: Compile (target interpreter catches PEP 701 f-strings)
        run: python -m compileall -q core recorder WEBUI bin run_transcribe.py tests

      - name: Lint
        run: ruff check .

      - name: Translations (placeholders, compiled catalogs up to date)
        run: |
          python scripts/check_translations.py
          pybabel compile -d WEBUI/translations
          git diff --exit-code -- WEBUI/translations

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          for script in install.sh scripts/streamvault_vps.sh bin/streamvault; do
            bash -n "$script"
          done
