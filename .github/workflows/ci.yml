name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = Ubuntu 22.04, 3.11 = Debian 12 (production targets); 3.12 = current.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.3

      - name: Compile (target interpreter catches PEP 701 f-strings)
        run: python -m compileall -q core recorder WEBUI bin tests

      - name: Lint
        run: ruff check .

      - name: Translations (placeholders, compiled catalogs up to date)
        run: |
          python scripts/check_translations.py
          pybabel compile -d WEBUI/translations
          git diff --exit-code -- WEBUI/translations

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          for script in install.sh scripts/streamvault_vps.sh scripts/ci_smoke.sh bin/streamvault; do
            bash -n "$script"
            test -x "$script" || { echo "$script is not executable"; exit 1; }
          done

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start the stack from a fresh clone
        run: |
          cp .env.example .env
          echo "VOD_USER=smoke" >> .env
          echo "VOD_PASS=$(openssl rand -hex 16)" >> .env
          echo "VOD_SECRET_KEY=$(openssl rand -hex 32)" >> .env
          docker compose up -d --build

      - name: nginx configuration
        run: docker compose exec -T nginx nginx -t

      - name: Smoke test through nginx
        run: |
          SMOKE_USER=smoke SMOKE_PASS="$(grep '^VOD_PASS=' .env | tail -n 1 | cut -d= -f2)" \
            scripts/ci_smoke.sh http://localhost:8090

      - name: Programs run and no traceback was logged
        run: |
          docker compose exec -T app supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status | tee status.txt
          test "$(grep -c RUNNING status.txt)" = "4"
          docker compose logs app > app.log 2>&1
          if grep -nE "Traceback|PermissionError|Operation not permitted" app.log; then exit 1; fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

  installer:
    name: Installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run install.sh
        run: sudo ./install.sh

      - name: nginx configuration and units
        run: |
          sudo nginx -t
          sleep 6
          systemctl is-active nginx streamvault-webui streamvault-recorder streamvault-worker streamvault-livebot

      - name: Smoke test through nginx
        run: |
          PASS="$(sudo grep '^VOD_PASS=' /etc/streamvault/env | cut -d= -f2)"
          SMOKE_USER=vaultadmin SMOKE_PASS="$PASS" scripts/ci_smoke.sh http://127.0.0.1
          curl -s "http://$(hostname -I | awk '{print $1}')/login" | grep -q StreamVault

      - name: CLI and update path
        run: |
          sudo streamvault check
          sudo -u streamvault git -C /opt/streamvault/app rev-parse HEAD

      - name: No traceback was logged
        run: |
          if sudo journalctl --no-pager -u 'streamvault-*' | grep -nE "Traceback|PermissionError"; then exit 1; fi
          if sudo grep -nE "Traceback|PermissionError" /var/log/streamvault/webui_error.log; then exit 1; fi

      - name: Logs on failure
        if: failure()
        run: sudo journalctl --no-pager -u 'streamvault-*' -n 200

  quickstart:
    name: README demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Commands from the README
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m venv .venv && . .venv/bin/activate
          pip install -q -r requirements.txt
          python scripts/demo_seed.py --base-dir ./demo-data
          sed -n '/^VOD_BASE_DIR=.\/demo-data/,/^python -m WEBUI.webui/p' README.md | tee demo.sh
          test -s demo.sh
          bash demo.sh > demo.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/login > /dev/null && exit 0
            sleep 1
          done
          cat demo.log
          exit 1
