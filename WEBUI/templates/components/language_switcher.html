<form method="post" action="{{ url_for('language_update') }}" class="ns-lang-switch">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') if request.method == 'GET' else request.path }}">
  <label for="ns-lang-select" class="sr-only">{{ _('Language') }}</label>
  {% if lang_compact %}
  {# Narrow rail: show a globe and the active language code; the native select sits invisibly on top so the dropdown keeps the full names. #}
  <span class="ns-lang-compact" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span>{{ current_locale.split('_')[0]|upper }}</span>
  </span>
  {% endif %}
  <select id="ns-lang-select" name="lang" onchange="this.form.submit()">
    <option value="">{{ _('Automatic (browser)') }}</option>
    {% for code, name in available_locales %}
    <option value="{{ code }}" lang="{{ code|replace('_', '-') }}"{% if request.cookies.get('sv_lang') == code %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{{ _('Apply') }}</button></noscript>
</form>
