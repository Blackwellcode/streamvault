<!doctype html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Overlay - {{ streamer }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #chat-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      overflow: hidden;
    }
    #chat-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }
    .chat-row {
      display: inline-block;
      align-self: flex-start;
      max-width: 100%;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(10, 10, 15, 0.55);
      backdrop-filter: blur(2px);
      color: #f1f5f9;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.5s ease;
    }
    body.no-box .chat-row {
      background: transparent !important;
      backdrop-filter: none !important;
      padding: 2px 4px;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-badges {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-right: 5px;
      vertical-align: middle;
    }
    .chat-badge {
      display: inline-block;
      height: 18px;
      width: auto;
      border-radius: 2px;
      vertical-align: middle;
    }
    .chat-author {
      font-weight: 700;
      margin-right: 6px;
      display: inline;
    }
    .chat-body {
      font-weight: 500;
      display: inline;
    }
    .chat-emote {
      display: inline-block;
      vertical-align: middle;
      height: 24px;
      margin: -2px 2px;
    }
    .chat-mod-notice {
      font-style: italic;
      color: #94a3b8;
      font-size: 13px;
    }
    /* Twitch-style chat rows; same tokens and values as style.css. */
    :root {
      --sv-twitch: #9147ff;
      --sv-twitch-ink: #bf94ff;
      --sv-highlight: #755ebc;
      --sv-announce-blue: linear-gradient(#00d6d6, #9146ff);
      --sv-announce-green: linear-gradient(#00db84, #57bee6);
      --sv-announce-orange: linear-gradient(#ffb31a, #e0e000);
      --sv-announce-purple: linear-gradient(#9146ff, #ff75e6);
      --sv-cheer-1: #9b9b9b;
      --sv-cheer-100: #be80f0;
      --sv-cheer-1000: #1db2a5;
      --sv-cheer-5000: #14a1fe;
      --sv-cheer-10000: #f87268;
    }
    .chat-row:is(.chat-line-notice, .chat-line-highlight, .chat-line-first, .chat-line-power-animated) {
      border-left: 4px solid var(--sv-twitch);
      border-radius: 0 6px 6px 0;
    }
    .chat-row.chat-line-notice { background: rgba(145, 71, 255, 0.28); }
    .chat-row.chat-line-announce-blue { border-image: var(--sv-announce-blue) 1; }
    .chat-row.chat-line-announce-green { border-image: var(--sv-announce-green) 1; }
    .chat-row.chat-line-announce-orange { border-image: var(--sv-announce-orange) 1; }
    .chat-row:is(.chat-line-announce-purple, .chat-line-announce-primary) { border-image: var(--sv-announce-purple) 1; }
    .chat-row.chat-line-highlight { border-left-color: var(--sv-highlight); background: rgba(117, 94, 188, 0.55); }
    .chat-row.chat-line-first { border-left-color: var(--sv-twitch-ink); }
    .chat-row.chat-line-power-animated {
      border-image: var(--sv-announce-purple) 1;
      background: linear-gradient(90deg, rgba(145, 71, 255, 0.45), rgba(255, 117, 230, 0.35));
    }
    .chat-row.chat-line-power-gigantified .chat-emote:last-of-type { height: 72px; }
    .chat-notice-head { display: flex; align-items: flex-start; gap: 6px; font-weight: 650; }
    .chat-notice-icon { width: 16px; height: 16px; flex: none; margin-top: 3px; fill: var(--sv-twitch-ink); }
    .chat-notice-body { display: block; margin-top: 2px; }
    .chat-notice-user { font-weight: 700; }
    .chat-cheer { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; }
    .chat-cheer-icon { width: 1em; height: 1em; fill: currentColor; }
    .chat-cheer-tier-1 { color: var(--sv-cheer-1); }
    .chat-cheer-tier-100 { color: var(--sv-cheer-100); }
    .chat-cheer-tier-1000 { color: var(--sv-cheer-1000); }
    .chat-cheer-tier-5000 { color: var(--sv-cheer-5000); }
    .chat-cheer-tier-10000 { color: var(--sv-cheer-10000); }
    .chat-context { display: block; font-size: 12px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-context-first { color: var(--sv-twitch-ink); font-weight: 600; }
    .chat-redeem-badge, .chat-mod-badge {
      display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 999px;
      color: #111318; font-size: 11px; font-weight: 800; text-shadow: none; vertical-align: 0.1em;
    }
    .chat-redeem-badge { background: #f2e58d; }
    .chat-mod-badge { background: #ff7b72; }
    .chat-mod-badge-timeout { background: #f0b429; }
    .chat-mod-badge-delete, .chat-mod-badge-clear { background: #8b949e; }
    .chat-redeem-title { color: #f2e58d; font-weight: 700; }
  </style>
</head>
<body>
  <div id="chat-wrapper">
    <div id="chat-list"></div>
  </div>

  {% include 'components/js_i18n.html' %}
  <script src="{{ url_for('static', filename='chat_emotes.js') }}"></script>
  <script nonce="{{ csp_nonce() }}">
    (function() {
      const streamer = {{ streamer|tojson }};
      const listEl = document.getElementById("chat-list");
      
      const params = new URLSearchParams(window.location.search);
      const fadeSec = parseInt(params.get("fade") || "0", 10);
      const noBox = params.get("box") === "0" || params.get("transparent") === "1";
      if (noBox) {
        document.body.classList.add("no-box");
      }

      let lastSince = 0;
      const seenIds = new Set();
      const maxLines = 40;

      function renderMessage(item) {
        const row = document.createElement("div");
        const lineClass = window.StreamVaultChat && window.StreamVaultChat.chatLineClassName
          ? window.StreamVaultChat.chatLineClassName(item).replace(/^chat-line\b/, "")
          : "";
        row.className = "chat-row" + lineClass;
        // System lines (mod actions, subs, raids, ...) render their own header.
        const isEvent = !!(item.event && item.event.type);

        // Badges
        if (!isEvent && Array.isArray(item.badges) && item.badges.length > 0 && window.StreamVaultChat && window.StreamVaultChat.renderBadgesHtml) {
          const badgeSpan = document.createElement("span");
          badgeSpan.className = "chat-badges";
          badgeSpan.innerHTML = window.StreamVaultChat.renderBadgesHtml(item);
          row.appendChild(badgeSpan);
        }

        // Author
        if (!isEvent) {
          const author = document.createElement("span");
          author.className = "chat-author";
          author.textContent = (item.user || {{ _('Anonymous')|tojson }}) + ":";
          const authorColor = window.StreamVaultChat && window.StreamVaultChat.userColor
            ? window.StreamVaultChat.userColor(item.color)
            : "";
          if (authorColor) author.style.color = authorColor;
          row.appendChild(author);
        }

        // Body
        const body = document.createElement("span");
        body.className = "chat-body";
        if (window.StreamVaultChat && window.StreamVaultChat.renderMessageHtml) {
          body.innerHTML = window.StreamVaultChat.renderMessageHtml(item);
        } else {
          body.textContent = item.msg || "";
        }
        row.appendChild(body);
        if (window.StreamVaultChat && window.StreamVaultChat.decorateLine) {
          window.StreamVaultChat.decorateLine(row, item);
        }

        listEl.appendChild(row);

        // Limit lines
        while (listEl.children.length > maxLines) {
          listEl.removeChild(listEl.firstChild);
        }

        // Auto fadeout if configured
        if (fadeSec > 0) {
          setTimeout(() => {
            row.style.opacity = "0";
            setTimeout(() => {
              if (row.parentNode) row.parentNode.removeChild(row);
            }, 600);
          }, fadeSec * 1000);
        }
      }

      async function fetchLiveChat() {
        try {
          const url = "/chat/live/" + encodeURIComponent(streamer) + "?since=" + encodeURIComponent(lastSince);
          const res = await fetch(url, { cache: "no-store", credentials: "same-origin" });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              for (const item of data) {
                const eventKey = window.StreamVaultChat && window.StreamVaultChat.chatEventKey
                  ? window.StreamVaultChat.chatEventKey(item)
                  : "";
                const key = (item.t || "") + "|" + (item.user || "") + "|" + eventKey + (item.msg || "");
                if (seenIds.has(key)) continue;
                seenIds.add(key);
                if (seenIds.size > 200) {
                  const first = seenIds.values().next().value;
                  seenIds.delete(first);
                }
                if (item.t && item.t > lastSince) {
                  lastSince = item.t;
                }
                renderMessage(item);
              }
            }
          }
        } catch (err) {}
        setTimeout(fetchLiveChat, 1200);
      }

      // Initialize emote and badge caches
      if (window.StreamVaultChat) {
        Promise.allSettled([
          window.StreamVaultChat.loadEmotes ? window.StreamVaultChat.loadEmotes(streamer) : Promise.resolve(),
          window.StreamVaultChat.loadBadges ? window.StreamVaultChat.loadBadges(streamer) : Promise.resolve()
        ]).finally(() => {
          fetchLiveChat();
        });
      } else {
        fetchLiveChat();
      }
    })();
  </script>
</body>
</html>
