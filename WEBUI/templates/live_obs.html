<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LIVE</title>
    <!-- NachtSilo mobile app -->
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <video id="player" autoplay playsinline></video>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1" referrerpolicy="no-referrer"></script>
    <script>
      const video = document.getElementById("player");
      const src = {{ playlist_url|tojson }};
      let hls = null;
      let starting = false;

      function playUnmuted() {
        video.muted = false;
        video.defaultMuted = false;
        video.volume = 1;
        video.removeAttribute("muted");
        const attempt = video.play();
        if (attempt && attempt.catch) attempt.catch(function () {});
      }

      function start() {
        if (starting) return;
        starting = true;
        if (hls) {
          try { hls.destroy(); } catch (err) {}
          hls = null;
        }
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 8,
            maxLiveSyncPlaybackRate: 1.05,
            maxBufferLength: 20,
            backBufferLength: 30,
            enableWorker: true,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 20,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 20,
            fragLoadingTimeOut: 15000,
            fragLoadingMaxRetry: 20
          });
          hls.on(Hls.Events.MANIFEST_PARSED, playUnmuted);
          hls.on(Hls.Events.ERROR, function (event, data) {
            if (!data || !data.fatal) return;
            try { hls.destroy(); } catch (err) {}
            hls = null;
            starting = false;
            setTimeout(start, 2000);
          });
          hls.loadSource(src);
          hls.attachMedia(video);
          return;
        }
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
          playUnmuted();
          return;
        }
        starting = false;
      }

      video.addEventListener("playing", playUnmuted);
      start();
      setInterval(function () {
        const probe = src + (src.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
        fetch(probe, {cache: "no-store", credentials: "omit"}).catch(function () {});
        if (!hls && video.readyState < 2) {
          starting = false;
          start();
        }
      }, 8000);
    </script>
  </body>
</html>
