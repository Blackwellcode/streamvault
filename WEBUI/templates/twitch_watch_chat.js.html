<script src="{{ url_for('static', filename='chat_emotes.js', v=ASSET_VERSION) }}"></script>
<script>
(function() {
  const channel = {{ channel|tojson }};
  const displayName = {{ display_name|tojson }};
  const statusUrl = {{ url_for('api_twitch_stream', login=channel)|tojson }};
  const chatUrl = {{ chat_feed_url|tojson }};
  const chatStreamer = {{ chat_streamer|tojson }};
  const RECENT_KEY = 'streamvault_twitch_recent_v1';

  try {
    let items = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    if (!Array.isArray(items)) items = [];
    items = [channel].concat(items.filter((x) => x !== channel)).slice(0, 16);
    localStorage.setItem(RECENT_KEY, JSON.stringify(items));
  } catch (e) {}

  const chatList = document.getElementById('chatList');
  const chatToggle = document.getElementById('chatAutoToggle');
  const chatEmpty = document.getElementById('chatEmpty');
  let autoScrollTwitch = true;
  let suppressScrollTwitch = false;
  let lastSince = 0;
  const renderedChatKeys = new Set();
  const chatAssetsReady = Promise.allSettled([
    (window.StreamVaultChat && window.StreamVaultChat.loadEmotes && window.StreamVaultChat.loadEmotes(chatStreamer)),
    (window.StreamVaultChat && window.StreamVaultChat.loadBadges && window.StreamVaultChat.loadBadges(chatStreamer))
  ]);

  function getUserColor(username) {
    const colors = [
      '#ef5350','#ec407a','#ab47bc','#7e57c2','#5c6bc0','#42a5f5',
      '#29b6f6','#26c6da','#26a69a','#66bb6a','#9ccc65','#d4e157',
      '#ffee58','#ffca28','#ffa726','#ff7043','#8d6e63','#bdbdbd'
    ];
    let hash = 0;
    for (let i = 0; i < username.length; i++) hash = username.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  function formatTime(ts) {
    const d = new Date(ts * 1000);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function processMsg(item) {
    return (window.StreamVaultChat && window.StreamVaultChat.renderMessageHtml && window.StreamVaultChat.renderMessageHtml(item)) || (item.msg || '');
  }

  function atBottom(list, thresholdPx) {
    if (!list) return true;
    const gap = list.scrollHeight - list.scrollTop - list.clientHeight;
    return gap <= (thresholdPx == null ? 72 : thresholdPx);
  }

  function scrollChatToBottom(list) {
    if (!list) return;
    suppressScrollTwitch = true;
    const stick = () => {
      list.scrollTop = list.scrollHeight;
    };
    stick();
    requestAnimationFrame(() => {
      stick();
      requestAnimationFrame(() => {
        stick();
        suppressScrollTwitch = false;
      });
    });
  }

  function setAutoScroll(enabled) {
    autoScrollTwitch = !!enabled;
    if (chatToggle) chatToggle.textContent = enabled ? 'Auto' : 'Pause';
  }

  function bindListScroll(list) {
    if (!list) return;
    list.addEventListener('scroll', () => {
      if (suppressScrollTwitch) return;
      // Stick while near bottom; pause only when the user scrolls away upward.
      setAutoScroll(atBottom(list));
    }, { passive: true });
  }
  bindListScroll(chatList);

  chatToggle && chatToggle.addEventListener('click', () => {
    setAutoScroll(true);
    scrollChatToBottom(chatList);
  });

  // After landscape chat opens, jump to latest if Auto is on.
  document.body && document.body.addEventListener('streamvault:landscape-chat', (ev) => {
    if (!(ev && ev.detail && ev.detail.open)) return;
    if (autoScrollTwitch) scrollChatToBottom(chatList);
  });

  function renderMessage(item) {
    if (!chatList) return;
    const rewardId = item.reward && item.reward.id ? item.reward.id : '';
    const eventPart = (window.StreamVaultChat && window.StreamVaultChat.chatEventKey)
      ? window.StreamVaultChat.chatEventKey(item)
      : (item.event && item.event.type ? ('event|' + item.event.type + '|') : '');
    const key = item.t + '|' + item.user + '|' + eventPart + (rewardId ? ('reward|' + rewardId + '|') : '') + (item.msg || '');
    if (renderedChatKeys.has(key)) return;
    renderedChatKeys.add(key);
    if (chatEmpty) chatEmpty.hidden = true;
    const line = document.createElement('div');
    const userColor = (window.StreamVaultChat && window.StreamVaultChat.userColor && window.StreamVaultChat.userColor(item.color)) || getUserColor(item.user || '');
    line.className = (window.StreamVaultChat && window.StreamVaultChat.chatLineClassName && window.StreamVaultChat.chatLineClassName(item))
      || (item.reward ? 'chat-line chat-line-redeem' : 'chat-line');
    line.innerHTML = '<span class="chat-time">' + formatTime(item.t) + '</span>' +
      '<span class="chat-text"><span class="chat-badges"></span><span class="chat-user" style="color:' + userColor + '"></span><span class="chat-msg"></span></span>';
    if (!item.event) {
      const badges = line.querySelector('.chat-badges');
      if (badges) badges.innerHTML = (window.StreamVaultChat && window.StreamVaultChat.renderBadgesHtml && window.StreamVaultChat.renderBadgesHtml(item)) || '';
      line.querySelector('.chat-user').textContent = (item.user || '') + (item.reward ? ' ' : ': ');
    }
    line.querySelector('.chat-msg').innerHTML = processMsg(item);
    if (window.StreamVaultChat && window.StreamVaultChat.decorateLine) window.StreamVaultChat.decorateLine(line, item);
    chatList.appendChild(line);
    while (chatList.children.length > 200) {
      chatList.removeChild(chatList.firstElementChild);
    }
  }

  let chatPolls = 0;
  async function pollChat() {
    if (!chatUrl) return;
    try {
      const resp = await fetch(chatUrl + '?since=' + lastSince);
      if (!resp.ok) return;
      const data = await resp.json();
      chatPolls += 1;
      if (!Array.isArray(data) || !data.length) {
        if (chatEmpty && !chatEmpty.hidden && chatPolls >= 2 && renderedChatKeys.size === 0) {
          chatEmpty.textContent = {{ _('No live chat available. Chat appears when StreamVault records the stream.')|tojson }};
        }
        return;
      }
      data.forEach((item) => {
        renderMessage(item);
        lastSince = Math.max(lastSince, Number(item.t) || 0);
      });
      if (autoScrollTwitch) scrollChatToBottom(chatList);
    } catch (e) {}
  }

  let chatPollTimer = null;
  function startChatPolling() {
    if (!chatPollTimer) chatPollTimer = setInterval(pollChat, 3000);
  }
  function stopChatPolling() {
    if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopChatPolling();
    } else {
      pollChat();
      startChatPolling();
    }
  });
  pollChat();
  startChatPolling();
  chatAssetsReady.finally(() => {});

  async function pollStatus() {
    try {
      const res = await fetch(statusUrl, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) return;
      const data = await res.json();
      const stream = data.stream || {};
      const live = !!stream.is_live;
      const livePill = document.getElementById('livePill');
      const livePillOverlay = document.getElementById('livePillOverlay');
      const offlineBanner = document.getElementById('offlineBanner');
      if (livePill) {
        if (live) livePill.removeAttribute('hidden');
        else livePill.setAttribute('hidden', '');
      }
      if (livePillOverlay) {
        if (live) livePillOverlay.removeAttribute('hidden');
        else livePillOverlay.setAttribute('hidden', '');
      }
      if (offlineBanner) {
        if (live) offlineBanner.setAttribute('hidden', '');
        else offlineBanner.removeAttribute('hidden');
      }
      const title = document.getElementById('watchTitle');
      const streamTitle = document.getElementById('watchStreamTitle');
      const game = document.getElementById('watchGame');
      const viewers = document.getElementById('watchViewers');
      const name = document.getElementById('watchDisplayName');
      const nameOverlay = document.getElementById('watchDisplayNameOverlay');
      const channelLink = document.querySelector('.vod-channel-link');
      if (title) {
        title.textContent = (stream.title && stream.title.trim()) || stream.display_name || displayName;
      }
      if (name && stream.display_name) name.textContent = stream.display_name;
      if (nameOverlay && stream.display_name) nameOverlay.textContent = stream.display_name;
      if (channelLink && stream.display_name) channelLink.textContent = stream.display_name;
      if (streamTitle) {
        const st = (stream.title || '').trim();
        const dn = (stream.display_name || displayName || '').trim();
        if (st && st !== dn) {
          streamTitle.textContent = st;
          streamTitle.removeAttribute('hidden');
        } else {
          streamTitle.textContent = '';
          streamTitle.setAttribute('hidden', '');
        }
      }
      if (game) game.textContent = stream.game_name || '—';
      if (viewers) viewers.textContent = live ? String(stream.viewer_count || 0) : '—';
      document.title = (live ? 'LIVE ' : '') + (stream.display_name || displayName) + ' · StreamVault';
    } catch (e) {}
  }
  setInterval(pollStatus, 60000);
})();
</script>
