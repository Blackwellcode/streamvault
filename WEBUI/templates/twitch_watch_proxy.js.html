{% if use_hls_proxy %}
<script src="{{ url_for('static', filename='mpegts.js', v=ASSET_VERSION) }}"></script>
<script nonce="{{ csp_nonce() }}">
(function() {
  // The local mpegts.js above is parser-blocking, so by now it has either run or failed.
  // On failure load the pinned CDN build once (replaces the former inline onerror handler).
  if (window.mpegts) return;
  const fallback = document.createElement('script');
  fallback.src = 'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js';
  fallback.addEventListener('error', function() {
    console.warn('[live] mpegts.js unavailable (local and CDN); using HLS fallback');
  }, { once: true });
  document.head.appendChild(fallback);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script nonce="{{ csp_nonce() }}">
(function() {
  const playlistUrl = {{ (hls_playlist_url or '')|tojson }};
  const readyUrl = {{ (hls_ready_url or '')|tojson }};
  const clientDebugUrl = {{ (hls_client_debug_url or '')|tojson }};
  const csrfToken = {{ csrf_token()|tojson }};
  const liveOauth = {{ (live_oauth_enabled or false)|tojson }};
  const channelName = {{ (channel or '')|tojson }};
  const debugEnabled = {{ (live_debug or false)|tojson }};
  if (!playlistUrl && !channelName) return;

  const video = document.getElementById('proxyPlayer');
  const waitEl = document.getElementById('proxyWait');
  const waitText = document.getElementById('proxyWaitText');
  const statusEl = document.getElementById('proxyStatus');
  if (!video) return;

  const unmuteBtn = document.getElementById('liveTapUnmute');
  function unmuteLive() {
    try {
      video.muted = false;
      video.defaultMuted = false;
      video.removeAttribute('muted');
      if (video.paused) {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(function() {});
      }
      if (unmuteBtn) unmuteBtn.hidden = true;
    } catch (_) {}
  }

  if (unmuteBtn) {
    unmuteBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      unmuteLive();
    });
  }
  video.addEventListener('click', function() {
    if (video.muted) unmuteLive();
    else if (video.paused) video.play();
  });
  if (waitEl) {
    waitEl.addEventListener('click', function() {
      unmuteLive();
    });
  }
  video.addEventListener('play', function() {
    if (video.muted && unmuteBtn) unmuteBtn.hidden = false;
  });
  video.addEventListener('volumechange', function() {
    if (!video.muted && unmuteBtn) unmuteBtn.hidden = true;
  });

  window.StreamVaultMediaSession && window.StreamVaultMediaSession.attach(video, {live: true});

  let mpegtsPlayer = null;
  let hls = null;
  let telemetryTimer = null;
  let ready = false;
  let readyPoll = null;
  let reconnectTimer = null;
  let reconnectAttempt = 0;
  let waitStartedAt = Date.now();
  let lastDebugSent = 0;
  const lastDebugByEvent = {};
  // The /live/<channel>.ts fan-out needs livebot. After repeated failures, before
  // the first frame or in a short time afterwards, stay on LL-HLS.
  let tsPlayed = false;
  let tsFailuresBeforePlay = 0;
  let tsFailuresAfterPlay = [];
  let preferLowLatencyHls = false;
  // Set once the direct nginx playlist failed; then hls.js uses the Flask playlist.
  let directHlsFailed = false;
  const profile = {{ (live_player_profile or 'desktop')|tojson }};
  const isMobilePlayer = profile === 'mobile'
    || document.body.classList.contains('page-twitch-watch-mobile')
    || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

  function dbg(level, eventName, extra) {
    try {
      const payload = Object.assign({
        channel: channelName,
        mode: mpegtsPlayer ? 'mpegts' : 'hls_proxy',
        level: level || 'info',
        event: eventName || 'event',
        ready: ready,
        waited_sec: Math.round((Date.now() - waitStartedAt) / 1000),
        reconnect_attempt: reconnectAttempt
      }, extra || {});
      if (debugEnabled) {
        try { console.log('[live-debug]', payload); } catch (e) {}
        if (statusEl && (level === 'error' || level === 'warn')) {
          statusEl.textContent = (eventName || '') + (payload.detail ? (': ' + payload.detail) : '');
        }
      }
      if (!clientDebugUrl) return;
      const now = Date.now();
      if (level !== 'error' && level !== 'warn' && now - lastDebugSent < 4000) return;
      // Warnings and errors too: a stuck ready poll would post one event per poll.
      const eventKey = (level || '') + ':' + (eventName || '');
      if (now - (lastDebugByEvent[eventKey] || 0) < 15000) return;
      lastDebugByEvent[eventKey] = now;
      lastDebugSent = now;
      fetch(clientDebugUrl, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'X-CSRFToken': csrfToken || ''
        },
        body: JSON.stringify(Object.assign({ csrf_token: csrfToken || '' }, payload))
      }).catch(function() {});
    } catch (e) {}
  }

  function setWait(visible, msg) {
    if (waitEl) {
      if (visible) waitEl.classList.add('is-visible');
      else waitEl.classList.remove('is-visible');
    }
    if (statusEl && msg) statusEl.textContent = msg;
  }

  function revealPlaying() {
    if (mpegtsPlayer) tsPlayed = true;
    setWait(false, 'Live');
  }

  // A live stream never ends for the player: whatever says so is a broken pipeline
  // (HLS, also native; the real-time player reconnects in its own handler).
  video.addEventListener('ended', function() {
    if (!ready) return;
    dbg('warn', 'playback_ended', {});
    scheduleReconnect({{ _('Connection lost — reconnecting…')|tojson }});
  });
  video.addEventListener('playing', revealPlaying);
  video.addEventListener('timeupdate', function() {
    if (video.currentTime > 0) revealPlaying();
  });

  // Pause for buffering. The flag tells media_session.js that this is neither the
  // user nor the browser, so it neither resumes early nor remembers a user pause.
  function holdPlayback() {
    video._streamVaultBuffering = true;
    if (!video.paused) video.pause();
  }

  function releasePlayback() {
    video._streamVaultBuffering = false;
  }

  let nativeErrorHandler = null;

  function destroyPlayers() {
    if (nativeErrorHandler) {
      video.removeEventListener('error', nativeErrorHandler);
      nativeErrorHandler = null;
    }
    if (telemetryTimer) {
      clearInterval(telemetryTimer);
      telemetryTimer = null;
    }
    if (mpegtsPlayer) {
      holdPlayback();
      try {
        mpegtsPlayer.pause();
        mpegtsPlayer.unload();
        mpegtsPlayer.detachMediaElement();
        mpegtsPlayer.destroy();
      } catch (e) {}
      mpegtsPlayer = null;
    }
    if (hls) {
      try { hls.destroy(); } catch (e) {}
      hls = null;
    }
  }

  function stopReadyPoll() {
    if (!readyPoll) return;
    clearTimeout(readyPoll);
    readyPoll = null;
  }

  // Fast while a fresh pipeline normally comes up, then slower, so a stream that
  // never starts does not keep polling 2.5 times per second.
  function readyPollDelayMs(baseMs) {
    const waited = Date.now() - waitStartedAt;
    if (waited < 15000) return baseMs;
    if (waited < 60000) return Math.max(baseMs, 1500);
    return Math.max(baseMs, 4000);
  }

  function ensureReadyPoll(intervalMs) {
    stopReadyPoll();
    const baseMs = intervalMs || 1000;
    function tick() {
      readyPoll = null;
      if (ready) return;
      checkPlaylist();
      readyPoll = setTimeout(tick, readyPollDelayMs(baseMs));
    }
    readyPoll = setTimeout(tick, baseMs);
  }

  function reconnectDelayMs() {
    const base = 1200;
    return Math.round(Math.min(15000, base * Math.pow(1.7, Math.min(reconnectAttempt, 8))));
  }

  function scheduleReconnect(msg) {
    ready = false;
    destroyPlayers();
    setWait(true, msg || {{ _('Connection lost — reconnecting…')|tojson }});
    dbg('warn', 'reconnect_scheduled', { detail: msg || '' });
    if (reconnectTimer) clearTimeout(reconnectTimer);
    const delay = reconnectDelayMs();
    reconnectAttempt += 1;
    reconnectTimer = setTimeout(function() {
      reconnectTimer = null;
      // Each reconnect gets a fresh fast-poll window.
      waitStartedAt = Date.now();
      checkPlaylist();
      ensureReadyPoll(1000);
    }, delay);
  }

  // Calls done() once `seconds` are buffered ahead of currentTime. maxWaitMs counts
  // from the first buffered data: on a cold start the server needs several seconds
  // before the first byte. Hard cap 30 s, so a stream without data never blocks.
  function whenBuffered(targetVideo, seconds, maxWaitMs, done) {
    const startedAt = Date.now();
    let firstDataAt = 0;
    (function check() {
      const now = Date.now();
      const b = targetVideo.buffered;
      const ahead = b && b.length ? b.end(b.length - 1) - targetVideo.currentTime : 0;
      if (ahead > 0 && !firstDataAt) firstDataAt = now;
      const waitedForData = firstDataAt ? now - firstDataAt : 0;
      if (ahead >= seconds || waitedForData >= maxWaitMs || now - startedAt >= 30000) {
        done();
        return;
      }
      setTimeout(check, 100);
    })();
  }

  // Counts a failed real-time connection; after repeated failures HLS is used.
  function noteTsFailure() {
    if (!tsPlayed) {
      tsFailuresBeforePlay += 1;
      if (tsFailuresBeforePlay >= 2) preferLowLatencyHls = true;
    } else {
      const now = Date.now();
      tsFailuresAfterPlay = tsFailuresAfterPlay.filter(function(t) { return now - t < 120000; });
      tsFailuresAfterPlay.push(now);
      if (tsFailuresAfterPlay.length >= 3) preferLowLatencyHls = true;
    }
    if (preferLowLatencyHls) {
      dbg('warn', 'mpegts_unavailable_use_hls', { detail: tsFailuresBeforePlay + '/' + tsFailuresAfterPlay.length });
    }
  }

  // Which playlist hls.js loads, and when a failed load switches to the other one.
  function hlsSourceUrl(directUrl) {
    return directHlsFailed && playlistUrl ? playlistUrl : directUrl;
  }
  function shouldUseFlaskPlaylist(details) {
    return !directHlsFailed && !!playlistUrl && /^manifest(Load|Parsing)/.test(String(details || ''));
  }

  function tryAutoplay() {
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    const p = video.play();
    if (p && typeof p.then === 'function') {
      p.then(function() {
        if (!isMobilePlayer) {
          window.setTimeout(function() {
            try {
              if (window.StreamVaultLiveClip && window.StreamVaultLiveClip.isOverlayOpen()) return;
              video.muted = false;
              video.defaultMuted = false;
              video.removeAttribute('muted');
            } catch (e) {}
          }, 300);
        } else {
          if (unmuteBtn) unmuteBtn.hidden = false;
        }
      }).catch(function(err) {
        dbg('warn', 'autoplay_blocked', { detail: String(err && err.message || err) });
        if (unmuteBtn) unmuteBtn.hidden = false;
      });
    }
  }

  function startTelemetry(modeName) {
    if (telemetryTimer) clearInterval(telemetryTimer);
    telemetryTimer = setInterval(function() {
      if (!ready || video.paused) return;
      if (video.buffered && video.buffered.length > 0) {
        const end = video.buffered.end(video.buffered.length - 1);
        const buf = Math.max(0, end - video.currentTime);
        if (statusEl && waitEl && !waitEl.classList.contains('is-visible')) {
          statusEl.textContent = modeName + ' • ' + {{ _('Buffer:')|tojson }} + ' ' + (buf ? buf.toFixed(1) : '0') + 's';
        }
      }
    }, 1000);
  }

  function initLowLatencyHlsPlayer(targetVideo, fallbackUrl) {
    dbg('info', 'init_ll_hls_fallback', { url: fallbackUrl });
    releasePlayback();
    const hlsUrl = fallbackUrl || ('/live/' + encodeURIComponent(channelName) + '/stream.m3u8');

    if (window.Hls && Hls.isSupported()) {
      let net = 0;
      let media = 0;
      hls = new Hls({
        lowLatencyMode: true,
        liveDurationInfinity: true,
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 8,
        maxLiveSyncPlaybackRate: 1.1,
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        enableWorker: !isMobilePlayer,
      });

      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        dbg('info', 'hls_manifest_parsed', {});
        tryAutoplay();
        startTelemetry('LL-HLS');
      });

      hls.on(Hls.Events.ERROR, function(_evt, data) {
        if (!data) return;
        if (!data.fatal) return;
        dbg('error', 'hls_fatal', { detail: String(data.details || data.type || '') });
        if (shouldUseFlaskPlaylist(data.details)) {
          // No direct nginx route (404) or not allowed there: the WebUI serves the
          // same segments after its own session check.
          directHlsFailed = true;
          dbg('warn', 'hls_direct_failed_use_webui', { detail: String(data.response && data.response.code || '') });
          hls.loadSource(hlsSourceUrl(hlsUrl));
          return;
        }
        if (/^manifest/.test(String(data.details || ''))) {
          // startLoad() never reloads a manifest that failed. Start over through the
          // ready poll, and with the direct playlist again.
          directHlsFailed = false;
          scheduleReconnect({{ _('HLS connection lost — reconnecting…')|tojson }});
          return;
        }
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && net < 6) {
          net += 1;
          hls.startLoad();
          return;
        }
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR && media < 3) {
          media += 1;
          hls.recoverMediaError();
          return;
        }
        scheduleReconnect({{ _('HLS connection lost — reconnecting…')|tojson }});
      });

      hls.loadSource(hlsSourceUrl(hlsUrl));
      hls.attachMedia(targetVideo);
      return;
    }

    if (targetVideo.canPlayType && targetVideo.canPlayType('application/vnd.apple.mpegurl')) {
      // Native HLS (iOS/Safari): the Flask playlist checks the session itself,
      // so playback does not depend on the direct nginx route.
      targetVideo.src = playlistUrl || hlsUrl;
      nativeErrorHandler = function() {
        dbg('error', 'native_hls_error', { code: targetVideo.error ? targetVideo.error.code : 'unknown' });
        scheduleReconnect({{ _('HLS connection lost — reconnecting…')|tojson }});
      };
      targetVideo.addEventListener('error', nativeErrorHandler, { once: true });
      tryAutoplay();
      startTelemetry('NATIVE-HLS');
      return;
    }

    ready = false;
    setWait(true, {{ _('Browser supports neither MPEG-TS nor live HLS.')|tojson }});
    dbg('error', 'playback_unsupported', {});
  }

  function canUseRealtimeTs() {
    const mseSupported = window.mpegts && mpegts.getFeatureList && mpegts.getFeatureList().mseLivePlayback;
    const nativeHlsPreferred = window.StreamVaultHls && StreamVaultHls.preferNativeHls(video);
    return !!(mseSupported && !nativeHlsPreferred && !preferLowLatencyHls);
  }

  function startPlayer() {
    if (ready) return;
    ready = true;
    if (waitText) waitText.hidden = false;
    reconnectAttempt = 0;
    stopReadyPoll();
    destroyPlayers();
    dbg('info', 'player_start', {});

    try {
      // 1. Primary: mpegts.js Ultra-Low-Latency Byte-Stream
      if (canUseRealtimeTs()) {
        dbg('info', 'init_mpegts_player', { channel: channelName });
        // Absolute URL: mpegts.js fetches inside a blob: worker without a base URL.
        const tsUrl = new URL('/live/' + encodeURIComponent(channelName) + '.ts', window.location.href).href;
        mpegtsPlayer = mpegts.createPlayer({
          type: 'mse',
          isLive: true,
          url: tsUrl,
          cors: true
        }, {
          enableWorker: !isMobilePlayer,
          enableStashBuffer: false,
          stashInitialSize: isMobilePlayer ? 384 : 128,
          liveBufferLatencyChasing: true,
          liveBufferLatencyMaxLatency: isMobilePlayer ? 2.5 : 3.0,
          liveBufferLatencyMinRemain: isMobilePlayer ? 0.6 : 1.0,
          liveSync: true,
          liveSyncMaxLatency: isMobilePlayer ? 2.5 : 3.0,
          liveSyncTargetLatency: isMobilePlayer ? 1.0 : 1.5,
          liveSyncPlaybackRate: 1.08,
          autoCleanupSourceBuffer: true,
          autoCleanupMaxBackwardDuration: 10,
          autoCleanupMinBackwardDuration: 5
        });

        // Start buffer: playing from the live edge left about 0.3 s of headroom and
        // audio dropped out on every network hiccup.
        const startBufferSec = isMobilePlayer ? 1.0 : 1.5;
        const playerAtStart = mpegtsPlayer;
        video.autoplay = false;
        holdPlayback();
        mpegtsPlayer.attachMediaElement(video);
        mpegtsPlayer.load();
        whenBuffered(video, startBufferSec, 5000, function() {
          if (mpegtsPlayer !== playerAtStart) return;
          releasePlayback();
          const p = playerAtStart.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function() {});
          }
          tryAutoplay();
        });
        startTelemetry('ULTRA-LOW-LATENCY MPEG-TS');

        mpegtsPlayer.on(mpegts.Events.ERROR, function(type, detail, info) {
          dbg('error', 'mpegts_error', {
            error_type: String(type),
            detail: String(detail),
            info: String(info || '')
          });
          noteTsFailure();
          scheduleReconnect({{ _('Real-time stream error — reconnecting…')|tojson }});
        });
        // The server closes the connection when its pipeline ends; mpegts.js reports
        // that as a regular end, and without this the last frame would stay frozen.
        mpegtsPlayer.on(mpegts.Events.LOADING_COMPLETE, function() {
          if (mpegtsPlayer !== playerAtStart) return;
          dbg('warn', 'mpegts_ended', {});
          noteTsFailure();
          scheduleReconnect({{ _('Connection lost — reconnecting…')|tojson }});
        });

        return;
      }

      // 2. Fallback: Low-Latency HLS (iOS / Safari)
      initLowLatencyHlsPlayer(video, '/live/' + encodeURIComponent(channelName) + '/stream.m3u8');

    } catch (e) {
      ready = false;
      destroyPlayers();
      dbg('error', 'player_start_failed', { detail: String(e && e.message || e) });
      scheduleReconnect({{ _('Player error — reconnecting…')|tojson }});
    }
  }

  // Catchup on Tab Visibility change
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && video.buffered && video.buffered.length > 0) {
      const end = video.buffered.end(video.buffered.length - 1);
      if (end - video.currentTime > 3.0) {
        video.currentTime = Math.max(0, end - 1.5);
      }
    }
  });

  async function checkPlaylist() {
    if (ready) return;
    try {
      if (readyUrl) {
        const resp = await fetch(readyUrl + (readyUrl.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), {
          cache: 'no-store',
          credentials: 'same-origin'
        });
        if (!resp.ok) {
          setWait(true, {{ _('Server is loading the stream…')|tojson }} + ' (' + resp.status + ')');
          dbg('warn', 'ready_http', { detail: String(resp.status) });
          return;
        }
        const data = await resp.json().catch(function() { return null; });
        if (data && data.ready) {
          startPlayer();
          return;
        }
        const waitedSec = Math.round((Date.now() - waitStartedAt) / 1000);
        if (data && data.twitch_live === false && waitedSec >= 20) {
          if (waitText) waitText.hidden = true;
          setWait(true, {{ _('Streamer is currently offline.')|tojson }});
          dbg('warn', 'offline', { detail: 'twitch_live=false' });
          return;
        }
        if (waitedSec >= 90) {
          setWait(true, {{ _('Stream is not starting — check the live status or reload the page.')|tojson }});
          dbg('error', 'ready_timeout', { detail: 'waited>=90s' });
          return;
        }
        setWait(true, {{ _('Server is loading the stream…')|tojson }});
        return;
      }

      // Fallback check on .ts endpoint
      const checkUrl = '/live/' + encodeURIComponent(channelName) + '.ts';
      const resp = await fetch(checkUrl, {
        method: 'HEAD',
        cache: 'no-store',
        credentials: 'same-origin'
      });
      if (resp.ok) {
        startPlayer();
        return;
      }
      setWait(true, {{ _('Server is loading the stream…')|tojson }} + ' (' + resp.status + ')');
    } catch (e) {
      setWait(true, {{ _('Waiting for server stream…')|tojson }});
      dbg('warn', 'ready_fetch_error', { detail: String(e && e.message || e) });
    }
  }

  function touchHeartbeat() {
    const url = readyUrl || ('/live/' + encodeURIComponent(channelName) + '.ts');
    if (!url) return;
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), {
      method: readyUrl ? 'GET' : 'HEAD',
      cache: 'no-store',
      credentials: 'same-origin'
    }).catch(function() {});
  }

  setWait(true, liveOauth
    ? {{ _('Server is loading the stream (Turbo, without viewer list)…')|tojson }}
    : {{ _('Server is loading the stream (without Twitch account)…')|tojson }});
  try { dbg('info', 'proxy_boot', {}); } catch (e) {}
  if (canUseRealtimeTs()) {
    // Fast start: livebot holds the .ts request until the first byte, so waiting for
    // the HLS playlist (about 2.5 s later on a cold start) only adds delay.
    startPlayer();
  } else {
    checkPlaylist();
    ensureReadyPoll(400);
  }
  setInterval(touchHeartbeat, 15000);

  // Rebuffer: after a stall continue only with about 1 s in the buffer. Otherwise
  // the player stays at 0.4-0.6 s and stalls again on the next hiccup.
  const REBUFFER_SEC = 1.0;
  let hasPlayed = false;
  let rebuffering = false;
  video.addEventListener('playing', function() { hasPlayed = true; });
  function rebufferAfterStall() {
    if (rebuffering || !hasPlayed || !ready || !mpegtsPlayer || video.paused) return;
    const b = video.buffered;
    if (b && b.length && b.end(b.length - 1) - video.currentTime >= REBUFFER_SEC) return;
    rebuffering = true;
    const playerAtStall = mpegtsPlayer;
    holdPlayback();
    whenBuffered(video, REBUFFER_SEC, 5000, function() {
      rebuffering = false;
      if (mpegtsPlayer !== playerAtStall) return;
      releasePlayback();
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});
    });
  }
  video.addEventListener('waiting', rebufferAfterStall);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && !ready) {
      scheduleReconnect({{ _('Reconnecting…')|tojson }});
    }
  });
  window.addEventListener('online', function() {
    if (!ready) scheduleReconnect({{ _('Network is back — reconnecting…')|tojson }});
  });
})();
</script>
{% endif %}
