
<script src="{{ url_for('static', filename='live_clip_overlay.js', v=ASSET_VERSION) }}"></script>
<script nonce="{{ csp_nonce() }}">
(function() {
  window.CLIP_SETTINGS = {{ clip_settings|tojson }};
  if (!window.StreamVaultLiveClip) return;
  // Instant clips must work on Twitch-embed watch too (no #proxyPlayer there).
  const player = document.getElementById('proxyPlayer');
  window.StreamVaultLiveClip.init({
    player: player || null,
    source: "live",
    instantUrl: {{ url_for('clip_instant', streamer=proxy_key or channel)|tojson }},
    settings: window.CLIP_SETTINGS
  });
})();
</script>
