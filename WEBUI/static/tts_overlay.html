<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTS Overlay</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #toast {
      position: absolute; left: 24px; bottom: 28px;
      max-width: min(640px, 86vw);
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10, 14, 22, 0.72);
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast .user { font-weight: 700; color: #7dd3fc; margin-right: .4em; }
    #toast .text { line-height: 1.35; }
    #status {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; color: rgba(148,163,184,.55);
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <div id="status">TTS idle</div>
  <div id="toast"><span class="user"></span><span class="text"></span></div>
  <audio id="player" preload="auto"></audio>
  <script src="/static/overlay_audio.js"></script>
  <script src="/static/tts_overlay.js"></script>
</body>
</html>
