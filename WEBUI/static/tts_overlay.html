<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTS Overlay</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #toast {
      position: absolute; left: 24px; bottom: 28px;
      max-width: min(640px, 86vw);
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10, 14, 22, 0.72);
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast .user { font-weight: 700; color: #7dd3fc; margin-right: .4em; }
    #toast .text { line-height: 1.35; }
    #status {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; color: rgba(148,163,184,.55);
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <div id="status">TTS idle</div>
  <div id="toast"><span class="user"></span><span class="text"></span></div>
  <audio id="player" preload="auto"></audio>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const streamer = params.get("streamer") || "";
    const showToast = params.get("toast") !== "0";
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const userEl = toastEl.querySelector(".user");
    const textEl = toastEl.querySelector(".text");
    const player = document.getElementById("player");

    let busy = false;
    let currentId = null;
    let skipTimer = null;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function showItem(user, text) {
      if (!showToast) return;
      userEl.textContent = user ? (user + ":") : "";
      textEl.textContent = text || "";
      toastEl.classList.add("show");
    }

    function hideToast() {
      toastEl.classList.remove("show");
    }

    function withAuth(path) {
      const u = new URL(path, location.origin);
      u.searchParams.set("token", token);
      u.searchParams.set("streamer", streamer);
      return u.pathname + u.search;
    }

    async function api(path, opts) {
      const res = await fetch(withAuth(path), opts);
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    }

    async function ack(id) {
      try {
        await api("/tts/api/ack?id=" + encodeURIComponent(id), {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id: id}),
        });
      } catch (e) {}
    }

    async function pollSkip() {
      if (!currentId || !busy) return;
      try {
        const data = await api("/tts/api/skipcheck?id=" + encodeURIComponent(currentId));
        if (data && data.skip) {
          player.pause();
          hideToast();
          const id = currentId;
          currentId = null;
          busy = false;
          await ack(id);
          setStatus("skipped");
        }
      } catch (e) {}
    }

    async function tick() {
      if (!streamer) {
        setStatus("streamer fehlt");
        return;
      }
      if (busy) return;
      try {
        const data = await api("/tts/api/next");
        if (!data || !data.item) {
          setStatus("TTS idle");
          return;
        }
        const item = data.item;
        busy = true;
        currentId = item.id;
        setStatus("playing · " + (item.user || ""));
        showItem(item.user, item.text);
        player.src = item.audio_url;
        try {
          await player.play();
        } catch (err) {
          setStatus("autoplay blocked — Interact + click once");
          const retry = async () => {
            try {
              player.muted = false;
              await player.play();
              setStatus("playing · " + (item.user || ""));
            } catch (e2) {
              setStatus("autoplay still blocked");
            }
          };
          window.addEventListener("pointerdown", retry, { once: true });
          return;
        }
      } catch (e) {
        setStatus("error");
      }
    }

    player.addEventListener("ended", async () => {
      const id = currentId;
      hideToast();
      currentId = null;
      busy = false;
      if (id) await ack(id);
      setStatus("TTS idle");
      tick();
    });

    player.addEventListener("error", async () => {
      const id = currentId;
      hideToast();
      currentId = null;
      busy = false;
      if (id) await ack(id);
      setStatus("audio error");
    });

    // Unlock autoplay on first user gesture (OBS interaction / click)
    window.addEventListener("pointerdown", () => {
      player.muted = false;
      player.play().catch(() => {});
    }, {once: true});

    setInterval(tick, 1200);
    setInterval(pollSkip, 800);
    tick();
  </script>
</body>
</html>
