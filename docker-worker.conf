; StreamVault container process supervisor
; Runs the WebUI, the recorder daemon and the background task worker in one
; container while keeping their lifecycles independent.
; supervisord itself stays root so it can drop privileges; every program runs
; as the unprivileged 'streamvault' user created in docker-compose.yml.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
; The WebUI (/healthz) queries supervisorctl as the streamvault user.
chmod=0770
chown=root:streamvault

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:webui]
user=streamvault
directory=/app
command=/usr/local/bin/gunicorn --workers 2 --worker-class gthread --threads 4 --bind 0.0.0.0:8080 --timeout 120 --access-logfile - --error-logfile - WEBUI.webui:app
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",HOME="/home/streamvault"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:recorder]
user=streamvault
directory=/app
command=/usr/local/bin/python3 recorder/Streamrecorder.py
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",HOME="/home/streamvault"
autostart=true
autorestart=true
startsecs=5
; FFmpeg needs up to FFMPEG_FINALIZE_TIMEOUT (30 s) to finalize MP4s; the
; supervisor default of 10 s would SIGKILL it and truncate recordings.
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
user=streamvault
directory=/app
command=/usr/local/bin/python3 recorder/worker.py
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",HOME="/home/streamvault"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
